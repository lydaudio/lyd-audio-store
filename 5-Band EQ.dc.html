<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><meta name="design_doc_mode" content="canvas"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><style>
.pf-eq5{--chassis-dark:#14181c;--chassis:#1e252b;--chassis-hi:#2a333b;--brass:#c8b273;--brass-dk:#8f7c48;--cream:#e9ddc2;--ink:#17160f;--red:#c1652b;--red-glow:#ff9a4d;--tan-txt:#b9c4c9}
*{box-sizing:border-box}
body{margin:0;background:#0c0d0a;font-family:'Oswald',sans-serif}
.mono{font-family:'Space Mono',monospace}
.plugin{width:900px;height:150px;position:relative;border-radius:8px;background:linear-gradient(180deg,var(--chassis-hi),var(--chassis) 6%,var(--chassis-dark) 100%);box-shadow:0 16px 46px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06),inset 0 -2px 0 rgba(0,0,0,.5);overflow:hidden;padding:10px 16px}
.plugin.finish-gunmetal{background:linear-gradient(180deg,#33352f,#26271f 6%,#17180f 100%)}
.plugin.finish-tan{background:linear-gradient(180deg,#4a4130,#3a3324 6%,#241f14 100%)}
.plugin::before{content:'';position:absolute;inset:0;background-image:url(assets/noise.png),url(assets/scratches.png),repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 2px,rgba(0,0,0,.015) 2px 4px),repeating-linear-gradient(50deg,rgba(255,255,255,.028) 0 1px,transparent 1px 65px),repeating-linear-gradient(-35deg,rgba(0,0,0,.05) 0 1px,transparent 1px 100px);background-blend-mode:overlay,screen,normal,normal,normal;background-size:280px 280px,460px 260px,auto,auto,auto;background-position:70px -15px,-25px 40px;pointer-events:none;mix-blend-mode:overlay}
.plugin::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 70px rgba(0,0,0,.6);background:radial-gradient(100px 45px at 6% 12%,rgba(25,35,42,.32),transparent 70%),radial-gradient(70px 90px at 94% 88%,rgba(20,30,36,.26),transparent 70%),radial-gradient(55px 42px at 40% 92%,rgba(18,26,32,.2),transparent 70%),radial-gradient(42px 38px at 80% 8%,rgba(28,38,45,.18),transparent 70%);pointer-events:none}
.screw{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a89865,var(--brass-dk) 55%,#463d24 100%);box-shadow:0 1px 2px rgba(0,0,0,.7),inset 0 0 2px rgba(0,0,0,.6);z-index:3}
.screw::before,.screw::after{content:'';position:absolute;background:rgba(0,0,0,.55);top:50%;left:50%}
.screw::before{width:6px;height:1.1px;transform:translate(-50%,-50%) rotate(var(--rot,28deg))}
.screw::after{width:1.1px;height:6px;transform:translate(-50%,-50%) rotate(var(--rot,28deg))}
.mainrow{height:100%;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;gap:8px}
.zone{display:flex;align-items:center;height:100%}
.zone.bordered{border-left:1px solid rgba(0,0,0,.45);box-shadow:1px 0 0 rgba(255,255,255,.04);padding-left:10px}
.vu{width:96px;height:88px;position:relative;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#1b1c15,#0f100b);padding:6px 7px 4px;box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 2px 0 rgba(255,255,255,.03);flex:none}
.vuface{width:100%;height:100%;border-radius:4px;background:radial-gradient(120% 100% at 50% 120%,var(--cream),#d9caa3 60%,#c9b788 100%);position:relative;overflow:hidden;box-shadow:inset 0 0 16px rgba(80,60,20,.25)}
.vuface::before{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 132%,transparent 0 40px,rgba(120,90,30,.06) 41px 43px);pointer-events:none}
.vuface::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:6;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.14) 14%,transparent 30%,transparent 100%),radial-gradient(130% 85% at 50% -15%,rgba(255,255,255,.22),transparent 55%);mix-blend-mode:screen}
.tick{position:absolute;left:50%;top:0;width:1.4px;height:6px;background:var(--ink);opacity:.55;transform-origin:50% 40px}
.tick.red{background:var(--red);opacity:.9}
.scalelabel{position:absolute;font-size:6px;color:var(--ink);opacity:.6;font-family:'Space Mono',monospace;transform-origin:50% 40px}
.needle{position:absolute;left:50%;top:60%;width:1.8px;height:39px;background:linear-gradient(180deg,var(--ink),#3a3020);transform-origin:50% 100%;border-radius:2px 2px 0 0;box-shadow:0 0 3px rgba(0,0,0,.4);z-index:4}
.needlehub{position:absolute;left:50%;top:60%;width:8px;height:8px;background:radial-gradient(circle at 35% 30%,#8f7c48,#5a4c2a);border-radius:50%;transform:translate(-50%,-50%);z-index:5;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.vulabel{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-size:6.5px;letter-spacing:.16em;color:var(--ink);opacity:.55;font-weight:600}
.groupszone{flex-direction:column;justify-content:center;gap:5px}
.groupbox{background:rgba(0,0,0,.22);border-radius:6px;padding:5px 9px 6px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.03)}
.grouplabel{font-size:7px;letter-spacing:.18em;color:var(--tan-txt);opacity:.7;margin-bottom:4px;text-align:center}
.bandrow,.togglerow{display:flex;gap:4px}
.tapebtn{padding:4px 6px;border-radius:3px;background:linear-gradient(180deg,#3a3b30,#25261c);color:var(--tan-txt);font-size:7.5px;letter-spacing:.04em;font-weight:600;border:1px solid rgba(0,0,0,.4);box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.tapebtn .led{width:4px;height:4px;border-radius:50%;background:#3a2c22;box-shadow:inset 0 0 2px rgba(0,0,0,.6)}
.tapebtn.active{background:linear-gradient(180deg,#454636,#2e2f22);color:var(--cream)}
.tapebtn.active .led{background:radial-gradient(circle at 35% 30%,var(--red-glow),var(--red));box-shadow:0 0 6px 1px rgba(255,90,61,.65)}
.tapebtn:active{transform:translateY(1px)}
.togglebtn{padding:4px 8px;border-radius:10px;background:linear-gradient(180deg,#2c2d22,#1c1d15);border:1px solid rgba(0,0,0,.4);color:var(--tan-txt);font-size:7px;letter-spacing:.06em;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.togglebtn.active{background:linear-gradient(180deg,var(--red),#7c2419);color:#f6e6d8;box-shadow:0 0 6px rgba(176,57,44,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.knobzone{flex-direction:column;justify-content:center;gap:5px;align-items:center}
.toprow{display:flex;align-items:baseline;gap:8px;justify-content:center;white-space:nowrap}
.toprow>*{flex-shrink:0}
.brandmark{display:flex;align-items:center;gap:5px}
.brand-dot{width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--red-glow),var(--red) 60%,#5c1a12);box-shadow:0 0 5px 1px rgba(255,90,61,.5)}
.brand-name{font-size:9px;letter-spacing:.18em;color:var(--tan-txt);font-weight:500}
.dot-sep{color:var(--tan-txt);opacity:.4;font-size:9px}
.modelplate{font-size:8px;color:var(--tan-txt);opacity:.55;letter-spacing:.04em}
.subtitle{font-size:13px;font-weight:600;letter-spacing:.16em;color:var(--cream);opacity:.92}
.knobsrow{display:flex;gap:9px}
.knob-unit{display:flex;flex-direction:column;align-items:center;gap:4px}
.knobface{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#e2d3a4,var(--brass) 42%,var(--brass-dk) 78%,#4c3f22 100%);box-shadow:0 3px 6px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.3),inset 0 -2px 4px rgba(0,0,0,.35);position:relative;cursor:grab;user-select:none}
.knobface:active{cursor:grabbing}
.knobface::before{content:'';position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.pointer{position:absolute;left:50%;top:3px;width:2px;height:13px;background:linear-gradient(180deg,#241d0f,#4a3c1f);border-radius:2px;transform-origin:50% 17px}
.knoblabel{font-size:7.5px;letter-spacing:.08em;color:var(--tan-txt);font-weight:600;text-align:center}
.knobval{font-size:6.5px;color:var(--tan-txt);opacity:.55;font-family:'Space Mono',monospace}
</style></helmet><div class="plugin pf-eq5 {{ finishClass }}"><div class="screw" style="top:7px;left:7px;--rot:22deg"></div><div class="screw" style="top:7px;right:7px;--rot:-14deg"></div><div class="screw" style="bottom:7px;left:7px;--rot:8deg"></div><div class="screw" style="bottom:7px;right:7px;--rot:-30deg"></div>
<div class="mainrow">
<div class="zone"><div class="vu"><div class="vuface"><sc-for list="{{ inTicks }}" as="t" hint-placeholder-count="9"><div class="tick {{ t.cls }}" style="transform:rotate({{ t.angle }}deg) translateX(-50%)"></div><div class="scalelabel" style="transform:rotate({{ t.angle }}deg) translate(-50%,-42px) rotate({{ t.counter }}deg)">{{ t.label }}</div></sc-for><div class="needle" style="transform:translateX(-50%) rotate({{ inAngle }}deg)"></div><div class="needlehub"></div><div class="vulabel">INPUT</div></div></div></div>
<div class="zone groupszone bordered"><div class="groupbox"><div class="grouplabel">BANDS</div><div class="bandrow"><sc-for list="{{ bands }}" as="b" hint-placeholder-count="5"><div class="tapebtn {{ b.activeClass }}" onClick="{{ b.onClick }}"><div class="led"></div>{{ b.label }}</div></sc-for></div></div></div>
<div class="zone knobzone bordered"><div class="toprow"><div class="brandmark"><div class="brand-dot"></div><div class="brand-name mono">LUA AUDIO</div></div><div class="dot-sep">·</div><div class="modelplate mono">EQ‑5 · 004419</div><div class="dot-sep">·</div><div class="subtitle">5‑BAND EQUALIZER</div></div><div class="knobsrow"><sc-for list="{{ knobs }}" as="k" hint-placeholder-count="5"><div class="knob-unit"><div class="knobface" onMouseDown="{{ k.onDown }}"><div class="pointer" style="transform:translateX(-50%) rotate({{ k.angle }}deg)"></div></div><div class="knoblabel">{{ k.label }}</div><div class="knobval">{{ k.display }}</div></div></sc-for></div></div>
<div class="zone groupszone bordered"><div class="groupbox"><div class="grouplabel">CHARACTER</div><div class="togglerow"><sc-for list="{{ characters }}" as="c" hint-placeholder-count="3"><div class="togglebtn {{ c.activeClass }}" onClick="{{ c.onClick }}">{{ c.label }}</div></sc-for></div></div></div>
<div class="zone bordered"><div class="vu"><div class="vuface"><sc-for list="{{ outTicks }}" as="t" hint-placeholder-count="9"><div class="tick {{ t.cls }}" style="transform:rotate({{ t.angle }}deg) translateX(-50%)"></div><div class="scalelabel" style="transform:rotate({{ t.angle }}deg) translate(-50%,-42px) rotate({{ t.counter }}deg)">{{ t.label }}</div></sc-for><div class="needle" style="transform:translateX(-50%) rotate({{ outAngle }}deg)"></div><div class="needlehub"></div><div class="vulabel">OUTPUT</div></div></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:150},&quot;chassisFinish&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Olive Drab&quot;,&quot;options&quot;:[&quot;Olive Drab&quot;,&quot;Gunmetal&quot;,&quot;Desert Tan&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;}}">
const CLAMP=(v,a,b)=>Math.max(a,Math.min(b,v));
class Component extends DCLogic{
  state={
    values:{low:50,lowmid:50,mid:50,himid:50,high:50},
    bands:['L','LM','M','HM','H'],
    character:'VINTAGE',
    inAngle:-20,
    outAngle:-24
  };
  componentDidMount(){this._raf=requestAnimationFrame(this.tick);}
  componentWillUnmount(){cancelAnimationFrame(this._raf);window.removeEventListener('mousemove',this._move);window.removeEventListener('mouseup',this._up);}
  tick=(ts)=>{
    const t=ts/1000;
    const swayA=Math.sin(t*2.1)*10+Math.sin(t*0.7)*4;
    const swayB=Math.sin(t*1.7+1.2)*9+Math.sin(t*0.5+0.4)*4;
    const inAngle=CLAMP(-8+swayA,-38,42);
    const outAngle=CLAMP(-6+swayB,-38,42);
    this.setState({inAngle,outAngle});
    this._raf=requestAnimationFrame(this.tick);
  };
  knobDef=[{key:'low',label:'LOW'},{key:'lowmid',label:'LO‑MID'},{key:'mid',label:'MID'},{key:'himid',label:'HI‑MID'},{key:'high',label:'HIGH'}];
  startDrag=(key,e)=>{
    e.preventDefault();
    this._dragKey=key;this._startY=e.clientY;this._startVal=this.state.values[key];
    this._move=(ev)=>{const dy=this._startY-ev.clientY;const nv=CLAMP(this._startVal+dy*0.6,0,100);this.setState(s=>({values:{...s.values,[this._dragKey]:nv}}));};
    this._up=()=>{window.removeEventListener('mousemove',this._move);window.removeEventListener('mouseup',this._up);};
    window.addEventListener('mousemove',this._move);window.addEventListener('mouseup',this._up);
  };
  toggleBand=(b)=>this.setState(s=>{const has=s.bands.includes(b);return {bands:has?s.bands.filter(x=>x!==b):[...s.bands,b]};});
  setCharacter=(c)=>this.setState({character:c});
  buildTicks(){const marks=[-30,-20,-10,-7,-5,-3,0,3,5];return marks.map(db=>{const norm=(db+30)/33;const angle=-40+norm*80;return {angle,counter:-angle,label:db>0?'+'+db:String(db),cls:db>=3?'red':''};});}
  renderVals(){
    const finish=this.props.chassisFinish||'Olive Drab';
    const finishClass=finish==='Gunmetal'?'finish-gunmetal':finish==='Desert Tan'?'finish-tan':'';
    const knobs=this.knobDef.map(k=>{const v=this.state.values[k.key];const angle=-135+(v/100)*270;return {label:k.label,angle,display:Math.round(v),onDown:(e)=>this.startDrag(k.key,e)};});
    const bandList=['L','LM','M','HM','H'].map(b=>({label:b,activeClass:this.state.bands.includes(b)?'active':'',onClick:()=>this.toggleBand(b)}));
    const charList=['SURGICAL','VINTAGE','SMOOTH'].map(c=>({label:c,activeClass:this.state.character===c?'active':'',onClick:()=>this.setCharacter(c)}));
    const ticks=this.buildTicks();
    return {finishClass,knobs,bands:bandList,characters:charList,inTicks:ticks,outTicks:ticks,inAngle:this.state.inAngle,outAngle:this.state.outAngle};
  }
}
</script>
</body>
</html>
